name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release metadata
        run: python tools/check_release_metadata.py
